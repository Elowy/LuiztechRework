name: Deploy to cPanel (FTP)

# Automatikus feltöltés a tárhelyre minden push-nál (a megadott ágakon),
# illetve kézzel is indítható a GitHub "Actions" fülről.
on:
  push:
    branches:
      - main
      - claude/luiz-tech-redesign-animations-6bwssl
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Diagnosztika: megmondja, megérkeztek-e az adatok (a titok ÉRTÉKÉT nem írja ki,
      # csak a hosszát/meglétét). Elfogad Secret-et ÉS Variable-t is.
      - name: Preflight (FTP adatok ellenőrzése)
        env:
          H: ${{ secrets.FTP_HOST || vars.FTP_HOST }}
          U: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          D: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
        run: |
          echo "FTP_HOST     : ${H:+OK} (hossz: ${#H})"
          echo "FTP_USERNAME : ${U:+OK} (hossz: ${#U})"
          echo "FTP_PASSWORD : ${P:+OK} (hossz: ${#P})"
          echo "FTP_SERVER_DIR: '${D:-(üres → ./ lesz)}'"
          fail=0
          [ -z "$H" ] && { echo "::error::FTP_HOST hiányzik (vedd fel Secret VAGY Variable néven: FTP_HOST)"; fail=1; }
          [ -z "$U" ] && { echo "::error::FTP_USERNAME hiányzik"; fail=1; }
          [ -z "$P" ] && { echo "::error::FTP_PASSWORD hiányzik"; fail=1; }
          if [ "$fail" = "1" ]; then
            echo "::error::Tipp: a Settings → Secrets and variables → Actions oldalon a 3 FTP adat lehet a 'Secrets' VAGY a 'Variables' fülön — ez a workflow mindkettőt elfogadja, de valamelyiken szerepelnie kell."
            exit 1
          fi

      - name: Deploy via FTP(S)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST || vars.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD || vars.FTP_PASSWORD }}
          protocol: ftps          # ha a tárhely nem támogatja: állítsd "ftp"-re
          port: 21
          # A dokumentumgyökér az FTP-belépéshez képest. public_html-be való
          # feltöltéshez (ha az FTP ott landol) hagyd "./"-n.
          server-dir: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR || './' }}
          local-dir: ./
          dangerous-clean-slate: false
          # Ezeket NEM töltjük fel és NEM is töröljük a szerverről:
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            node_modules/**
            server/**
            data/**
            app.js
            package.json
            package-lock.json
            Dockerfile
            Procfile
            .dockerignore
            **/*.md
            config.php
            config.sample.php
            uploads/**
            .gitignore
